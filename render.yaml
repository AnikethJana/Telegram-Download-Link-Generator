services:
  - type: web
    name: telegram-download-link-generator
    env: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/info
    envVars:
      # --- Telegram Core (Required) ---
      - key: API_ID
        sync: false
      - key: API_HASH
        sync: false
      - key: BOT_TOKEN
        sync: false
      
      # --- Channels (Required) ---
      - key: LOG_CHANNEL
        sync: false
      
      # --- Web Server (Required) ---
      - key: BASE_URL
        sync: false
      - key: PORT
        value: 8080
      - key: BIND_ADDRESS
        value: 0.0.0.0
      
      # --- Video Streaming Frontend ---
      - key: VIDEO_FRONTEND_URL
        value: https://cricster.pages.dev
      
      # --- Settings ---
      - key: SESSION_NAME
        value: MyBotSession
      - key: WORKERS
        value: 4
      - key: GITHUB_REPO_URL
        value: https://github.com/AnikethJana/Telegram-Download-Link-Generator
      
      # --- Admin Users (Required) ---
      - key: ADMINS
        sync: false
      
      # --- Session Generator Access Control ---
      - key: ALLOW_USER_LOGIN
        value: true

      # --- Premium Access Owner ---
      - key: OWNER_ID
        sync: false

      # --- Premium Transaction Channel ---
      - key: TXN_CHNL_ID
        sync: false

      # --- Pricing Configuration ---
      - key: PRICE_PER_DAY_USD
        value: 0.15
      - key: PRICE_PER_DAY_INR
        value: 14.3

      # --- Payment Methods ---
      - key: USDT_BEP20_ADDRESS
        value: ""
      - key: UPI_ID
        value: ""
      
      # --- Multiple Bot Support ---
      - key: ADDITIONAL_BOT_TOKENS
        value: ""
      - key: WORKER_CLIENT_PYROGRAM_WORKERS
        value: 1
      - key: WORKER_SESSIONS_IN_MEMORY
        value: true
      
      # --- CORS Configuration ---
      - key: CORS_ALLOWED_ORIGINS
        value: ""
      
      # --- Database (MongoDB) (Required) ---
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_NAME
        value: TgDlBotUsers
